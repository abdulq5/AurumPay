spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: ${DB_URL:jdbc:h2:mem:aurumpay;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration/h2
  h2:
    console:
      enabled: true
      path: /h2-console